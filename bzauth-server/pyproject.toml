[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bzauth-server"
dynamic = ["version"]
description = ''
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = []
authors = [
  { name = "zaf-x", email = "baoshuwen2013@outlook.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "argon2-cffi",
  "requests",
  "flask"
]

[project.urls]
Documentation = "https://github.com/zaf-x/bzauth-server#readme"
Issues = "https://github.com/zaf-x/bzauth-server/issues"
Source = "https://github.com/zaf-x/bzauth-server"

[tool.hatch.version]
path = "src/bzauth_server/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/bzauth_server tests}"

[tool.coverage.run]
source_pkgs = ["bzauth_server", "tests"]
branch = true
parallel = true
omit = [
  "src/bzauth_server/__about__.py",
]

[tool.coverage.paths]
bzauth_server = ["src/bzauth_server", "*/bzauth-server/src/bzauth_server"]
tests = ["tests", "*/bzauth-server/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
